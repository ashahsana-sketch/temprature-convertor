 <!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Celsius Converter</title>
  </head>
  <body>

  <h2>Celsius to Fahrenheit and Kelvin Conversion Tool</h2>

  <form>
      <label for="celsius">Enter Temperature in Celsius:</label>
      <input type="number" id="celsius" value="" step="any">

      <button onclick="convertCtoFAndK()">Convert</button>
  </form>

  <p id="result"></p>

  <script>
      function convertCtoFAndK() {
          const celsius = document.getElementById('celsius').value;
          let fahrenheit, kelvin;

          if (celsius > -273.15) {
              // Celsius to Fahrenheit
              fahrenheit = (celsius * 9/5) + 32;
              document.getElementById("result").innerHTML = `Temperature in Fahrenheit: ${fahrenheit}°F`;
          } else {
              document.getElementById("result").innerHTML = "Invalid temperature";
          }

          if (celsius > 0) {
              // Celsius to Kelvin
              kelvin = celsius + 273.15;
              document.getElementById("result").innerHTML += ` Temperature in Kelvin: ${kelvin}K`;
          } else {
              document.getElementById("result").innerHTML += " Temperature in Kelvin is not defined";
          }
      }
  </script>

  </body>
  </html>
